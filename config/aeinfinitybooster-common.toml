#General settings for AEInfinityBooster
[general]
	#The amount of power the Dimension Card drains per tick
	# Default: 100
	# Range: > 0
	dimensionCardDrain = 1000
	#The amount of power the Infinity Card drains per tick
	# Default: 50
	# Range: > 0
	infinityCardDrain = 500
	#If true, inserting a Dimension Card or Infinity Card into a Wireless Access Point
	#will keep the chunk loaded even when no players are nearby.
	chunkLoadingEnabled = true
